x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-fraudlens}:${POSTGRES_PASSWORD:-fraudlens}@postgres:5432/${AIRFLOW_DB:-airflow}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Application imports resolve inside the isolated external Python environment.
    PYTHONPATH: /opt/fraudlens
    FRAUDLENS_ROOT: /opt/fraudlens
    TRAINING_INPUT: ${TRAINING_INPUT:-}
    INFERENCE_INPUT: ${INFERENCE_INPUT:-}
    TRAINING_SPLIT: ${TRAINING_SPLIT:-stratified}
    DATASET_KIND: ${DATASET_KIND:-unknown}
    STORAGE_MODE: ${STORAGE_MODE:-local}
    RAW_DATA_FILENAME: ${RAW_DATA_FILENAME:-creditcard_sample.csv}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-fraudlens}
    POSTGRES_USER: ${POSTGRES_USER:-fraudlens}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudlens}
    AWS_REGION: ${AWS_REGION:-us-east-1}
    AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
  volumes: &airflow-common-volumes
    - ./airflow/dags:/opt/airflow/dags
    - fraudlens_data:/opt/fraudlens/data
    - fraudlens_models:/opt/fraudlens/models
    - ./data/incoming:/incoming:ro
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraudlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudlens}
      POSTGRES_DB: ${POSTGRES_DB:-fraudlens}
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init/01_create_airflow_db.sh:/docker-entrypoint-initdb.d/01_create_airflow_db.sh
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraudlens} -d ${POSTGRES_DB:-fraudlens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      STORAGE_MODE: ${STORAGE_MODE:-local}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-fraudlens}
      POSTGRES_USER: ${POSTGRES_USER:-fraudlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudlens}
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      ADMIN_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    entrypoint: /bin/bash
    command:
      - -c
      - >
        set -e;
        airflow db migrate;
        airflow users list --output json > /tmp/users.json;
        if python -c 'import json, os, sys; sys.exit(not any(u["username"] == os.environ["ADMIN_USERNAME"] for u in json.load(open("/tmp/users.json"))))'; then
        echo "Admin user already exists";
        else airflow users create
        --username "$$ADMIN_USERNAME"
        --password "$$ADMIN_PASSWORD"
        --firstname Admin --lastname User --role Admin --email admin@example.com; fi

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  airflow_logs:
  fraudlens_data:
  fraudlens_models:
