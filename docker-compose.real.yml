# Optional one-time importer. Run this with the normal compose file; it does
# not start during ordinary `docker compose up`.
services:
  model-import:
    image: fraudlens-airflow:local
    profiles: [real-model]
    environment:
      FRAUDLENS_ROOT: /opt/fraudlens
      PYTHONPATH: /opt/fraudlens
      STORAGE_MODE: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-fraudlens}
      POSTGRES_USER: ${POSTGRES_USER:-fraudlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudlens}
    volumes:
      - fraudlens_models:/opt/fraudlens/models
      - ./data/incoming:/incoming:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/opt/fraudlens-venv/bin/python", "-m", "scripts.deploy_real_model"]
    command:
      - --archive
      - /incoming/fraudlens-model-release.zip
      - --expected-archive-sha256
      - ${MODEL_ARCHIVE_SHA256:-}
